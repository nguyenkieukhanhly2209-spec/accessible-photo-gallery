<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <h1>Accessible Photo Gallery</h1>
    <h2>Hover or Tab through the images below</h2>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <div class="preview">
        <img class="preview" alt="Bức ảnh phong cảnh số 1" src="https://picsum.photos/id/1015/600/400" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" alt="Bức ảnh thiên nhiên số 2" src="https://picsum.photos/id/1016/600/400" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" alt="Bức ảnh ngọn núi số 3" src="https://picsum.photos/id/1018/600/400" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" alt="Bức ảnh dòng sông số 4" src="https://picsum.photos/id/1020/600/400" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" alt="Bức ảnh bờ biển số 5" src="https://picsum.photos/id/1025/600/400" onmouseover="upDate(this)" onmouseout="unDo()">
        <img class="preview" alt="Bức ảnh rừng cây số 6" src="https://picsum.photos/id/1035/600/400" onmouseover="upDate(this)" onmouseout="unDo()">
    </div>
</body>
</html>
